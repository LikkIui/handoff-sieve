name: Bug report
description: Report a reproducible core, audit, configuration, or adapter bug
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Use synthetic data only. Report security vulnerabilities through the
        private link in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: HandoffSieve version or commit
      placeholder: 0.1.0a1 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python, operating system, framework, and framework version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include policy order and runnable code or YAML when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected receiver view or audit behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include failure_code and failed_policy; remove content values.
    validations:
      required: true
  - type: checkboxes
    id: safe-data
    attributes:
      label: Data safety
      options:
        - label: This report contains only synthetic data and no real secrets.
          required: true
