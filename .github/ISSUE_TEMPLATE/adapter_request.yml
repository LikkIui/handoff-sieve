name: Adapter request
description: Propose a framework boundary with a concrete handoff contract
title: "[Adapter] "
labels: [adapter]
body:
  - type: input
    id: framework
    attributes:
      label: Framework and versions
    validations:
      required: true
  - type: textarea
    id: handoff
    attributes:
      label: Handoff boundary
      description: Describe the objects that cross from sender to receiver.
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: Canonical state and receiver view
      description: Explain what must remain canonical and what may be filtered.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Control and tool invariants
      description: List IDs, call/output pairs, ordering, streaming, or checkpoint rules.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal public or synthetic example
    validations:
      required: true
