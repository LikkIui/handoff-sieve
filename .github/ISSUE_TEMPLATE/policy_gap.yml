name: Policy false positive or false negative
description: Report a pattern or policy result using a synthetic fixture
title: "[Policy gap] "
labels: [policy]
body:
  - type: dropdown
    id: gap
    attributes:
      label: Result type
      options:
        - False negative
        - False positive
        - Protected-content loss
        - Budget or counting mismatch
        - Other policy contract issue
    validations:
      required: true
  - type: input
    id: policy
    attributes:
      label: Policy and configuration
      placeholder: RedactPolicy(detectors=["email"])
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal synthetic fixture
      description: Use obviously fake values and label the expected match or retention.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed and expected result
    validations:
      required: true
  - type: checkboxes
    id: safe-data
    attributes:
      label: Data safety
      options:
        - label: This report contains only synthetic data and no real secrets.
          required: true
