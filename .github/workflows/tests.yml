name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,tiktoken]"
      - run: python -m pytest

  openai-adapter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        openai-agents-version: ["0.22.0", "0.22.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: >-
          python -m pip install -e ".[dev]"
          "openai-agents==${{ matrix.openai-agents-version }}"
      - run: python -m pytest tests/test_openai_adapter.py

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv wheel-venv
      - run: wheel-venv/bin/python -m pip install dist/*.whl
      - run: >-
          cd /tmp &&
          "$GITHUB_WORKSPACE/wheel-venv/bin/python" -I -c
          "import relayguard; assert relayguard.__version__ == '0.1.0'"
