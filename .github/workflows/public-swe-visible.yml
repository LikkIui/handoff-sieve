name: public-swe-visible-feedback
run-name: Visible feedback · ${{ inputs.request || github.sha }}

on:
  push:
    paths:
      - evals/public_swe/results/**/visible-request.json
  workflow_dispatch:
    inputs:
      request:
        description: Repository-relative visible-request.json within public results
        required: true
        type: string

permissions:
  contents: read

jobs:
  visible:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install container client only
        run: python -m pip install 'docker>=7,<8'
      - name: Run original visible tests, without the hidden grader
        env:
          REQUESTED_PATH: ${{ inputs.request }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          from pathlib import Path
          request = os.environ.get('REQUESTED_PATH')
          if not request:
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', 'HEAD^', 'HEAD'], text=True
              ).splitlines()
              requests = [p for p in changed if p.startswith('evals/public_swe/results/')
                          and p.endswith('/visible-request.json')]
              if len(requests) != 1:
                  raise ValueError('Submit exactly one visible request per batch')
              request = requests[0]
          if not Path(request).is_file():
              raise ValueError('Visible feedback request is missing')
          subprocess.run([sys.executable, '-m', 'evals.public_swe.visible',
                          '--request', request], check=True)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: public-swe-visible-${{ github.run_id }}
          path: visible-feedback/
          if-no-files-found: warn
