name: public-swe-development

on:
  push:
    paths:
      - evals/public_swe/control-request.json
      - evals/public_swe/results/**/predictions.json
      - .github/workflows/public-swe.yml
  workflow_dispatch:
    inputs:
      results:
        description: Repository-relative candidate directory (empty for controls)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.tasks.outputs.tasks }}
      results: ${{ steps.tasks.outputs.results }}
    steps:
      - uses: actions/checkout@v6
      - id: tasks
        env:
          REQUESTED_RESULTS: ${{ inputs.results }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path('evals/public_swe/control-request.json').read_text())
          results = os.environ.get('REQUESTED_RESULTS') or request.get('results', '')
          if results:
              p = Path(results).resolve()
              if not p.is_relative_to(Path('evals/public_swe/results').resolve()):
                  raise ValueError('Candidate directory must stay within public results')
              tasks = json.loads((p / 'run-manifest.json').read_text())['task_ids']
          else:
              tasks = request['task_ids']
          manifest = json.loads(Path('evals/public_swe/data/manifest.json').read_text())
          if not tasks or len(tasks) > 10 or set(tasks) - set(manifest['splits']['development']):
              raise ValueError('This workflow only grades at most ten development tasks')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('tasks=' + json.dumps(tasks) + '\n')
              f.write('results=' + results + '\n')
          PY

  grade:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        instance: ${{ fromJSON(needs.prepare.outputs.tasks) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned official grader and data reader
        run: |
          python -m pip install -e '.[public-eval]'
          python -m pip install 'git+https://github.com/SWE-bench/SWE-bench.git@02e7a74ffd0b707aab73d203fe87bdc7c76afc8e'
      - name: Grade controls and available candidates in upstream containers
        env:
          INSTANCE_ID: ${{ matrix.instance }}
          CANDIDATE_RESULTS: ${{ needs.prepare.outputs.results }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          command = [sys.executable, '-m', 'evals.public_swe.grade']
          if os.environ['CANDIDATE_RESULTS']:
              command += ['--results', os.environ['CANDIDATE_RESULTS']]
          subprocess.run(command, check=True)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: public-swe-${{ matrix.instance }}
          path: |
            upstream-grading/
            logs/run_evaluation/
          if-no-files-found: warn
