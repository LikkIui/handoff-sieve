version: 1
on_unmatched: error
on_multiple_match: error

rules:
  - id: researcher-to-writer
    from: researcher
    to: writer
    policies:
      - preserve:
          tags: [constraint, citation, conclusion]
          fields: [constraints, citations, conclusions]
      - redact:
          detect: [api_key, email]
      - deduplicate: exact
      - budget:
          max_tokens: 140
          strategy: drop_oldest

