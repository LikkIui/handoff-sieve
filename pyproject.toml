[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff-sieve"
dynamic = ["version"]
description = "Receiver-specific context compiler for AI agent handoffs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "HandoffSieve contributors" },
]
maintainers = [
  { name = "LikkIui" },
]
keywords = ["agents", "multi-agent", "handoff", "context", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "regex>=2024.11.6,<2027",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12",
  "types-regex>=2024.11.6",
]
openai = [
  "openai-agents>=0.22,<0.23",
]
langgraph = [
  "langgraph>=1.0,<2",
]
tiktoken = [
  "tiktoken>=0.8",
]
release = [
  "build>=1,<2",
  "twine>=6,<7",
]

[project.urls]
Repository = "https://github.com/LikkIui/handoff-sieve"
Issues = "https://github.com/LikkIui/handoff-sieve/issues"
Security = "https://github.com/LikkIui/handoff-sieve/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
handoff_sieve = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "handoff_sieve._version.__version__" }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

